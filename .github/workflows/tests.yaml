name: Spread tests
on:
  schedule:
    # Weekly sunday testing for bitrot
    - cron: '0 12 * * 0'
  push:
    branches:
      - main
      - 'core[0-9][0-9]'
  pull_request:
    branches:
      - main
      - 'core[0-9][0-9]'

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, x64, linux, spread-enabled]
    steps:
      - name: Cleanup job workspace
        id: cleanup-job-workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - uses: actions/checkout@v4

      - name: x86 build
        run: |
          spread -artifacts=./artifacts openstack-ext:tests/spread/build/
          find ./artifacts -type f -name core24_amd64.artifact -exec cp {} "${{ github.workspace }}" \;
      
      - name: arm64 build
        run: |
          spread -artifacts=./artifacts openstack-arm-ext:tests/spread/build/
          find ./artifacts -type f -name core24_arm64.artifact -exec cp {} "${{ github.workspace }}" \;

      - uses: actions/upload-artifact@v4
        with:
          name: core-snap
          path: "${{ github.workspace }}/*.artifact"
          if-no-files-found: error

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done

  cve-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cleanup job workspace
        id: cleanup-job-workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: core-snap

      - name: Install CVE scanner
        run: |
          sudo snap install review-tools

      # Run just for amd64 for now
      - name: run CVE scanner for amd64
        run: |
          # rename the .artifact to a .snap so that the scanner accepts it
          mv "${{ github.workspace }}/core24_amd64.artifact" "${{ github.workspace }}/core24_amd64.snap"
          # this produces a table of detected CVEs and their severity
          review-tools.scan-snap "${{ github.workspace }}/core24_amd64.snap" > "${{ github.workspace }}/cve-scan-amd64.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: cve-scan
          path: "${{ github.workspace }}/cve-scan-amd64.txt"

  tests-main:
    runs-on: [self-hosted, x64, linux, spread-enabled]
    needs: build
    steps:
      - name: Cleanup job workspace
        id: cleanup-job-workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-snap

      - name: Run x86 tests
        uses: ./.github/actions/run-spread-tests
        with:
          spread-command: spread openstack-ext:tests/spread/main/

      - name: Run arm64 tests
        uses: ./.github/actions/run-spread-tests
        with:
          spread-command: spread openstack-arm-ext:tests/spread/main/

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done
  tests-snapd:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cleanup job workspace
        id: cleanup-job-workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      
      - uses: actions/checkout@v4
        with:
          path: core-base
      - uses: actions/checkout@v4
        with:
          repository: 'snapcore/snapd'
          path: snapd
      - uses: actions/download-artifact@v4
        with:
          name: core-snap
      
      - name: Install spread
        run: curl -s https://storage.googleapis.com/snapd-spread-tests/spread/spread-amd64.tar.gz | sudo tar xzv -C /usr/bin

      - name: Build image
        working-directory: '${{ github.workspace }}'
        run: |
          PROJECT_PATH=$PWD/core-base
          # For os.query and others
          PATH=$PATH:$PROJECT_PATH/tests/lib/external/snapd-testing-tools/tools/
          . "core-base/tests/lib/prepare-utils.sh"

          echo "************* INSTALLING DEPS *************"
          install_base_deps

          echo "************* DOWNLOADING SNAPS *************"
          download_core24_snaps 'edge'

          echo "************* WRITING CLOUD-INIT CONFIG *************"
          prepare_base_cloudinit

          echo "************* BUILDING CORE24 IMAGE *************"
          uc_snap="$(get_core_snap_name)"
          mv core24_"$(get_arch)".artifact "$uc_snap"
          build_base_image

          echo "************* STARTING CORE24 VM *************"
          start_snapd_core_vm '${{ github.workspace }}'

      - name: Run snapd spread
        uses: ./core-base/.github/actions/run-spread-tests
        with:
          working-directory: snapd
          spread-command: SPREAD_EXTERNAL_ADDRESS=localhost:8022 spread external:ubuntu-core-24-64:tests/smoke/

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done

