name: Release bases

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build_releases:
    strategy:
      fail-fast: false
      matrix:
        # main is currently core26
        base: [core18, core20, core22, core24, main]
        variant: [regular, fips, cloud-init]
        exclude:
          # No fips for core26 (yet)
          - base: main
            variant: fips
          # No fips or cloud init for core18
          - base: core18
            variant: cloud-init
          - base: core18
            variant: fips
          # No fips or cloud init for core20
          - base: core20
            variant: cloud-init
          - base: core20
            variant: fips
          # No cloud-init for core22
          - base: core22
            variant: cloud-init
          # No cloud-init for core24
          - base: core24
            variant: cloud-init
    runs-on: ubuntu-latest
    environment: store
    steps:
      - name: Build and release ${{ matrix.base }} to edge channel
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        uses: snapcore/system-snaps-cicd-tools/action-rebuild-base@main
        with:
          branch: ${{ matrix.base }}
          build-variant: ${{ matrix.variant }}
          optional-architectures: riscv64,i386
