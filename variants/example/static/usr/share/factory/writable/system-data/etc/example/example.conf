# factory template for the example variant's writable /etc/example
# mount (see variants/example/fstab.d/example.conf); the
# 993-factory-files build-time test requires it for the C line in
# variants/example/writable.conf.d/example.conf
This directory is the factory template of the example build variant's
/etc/example writable mount. At first boot, systemd-tmpfiles copies it
to /writable/system-data/etc/example (the C line in
core-writable.conf), which the initrd bind-mounts to /etc/example.
