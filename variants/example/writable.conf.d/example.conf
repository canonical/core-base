# Example variant writable paths (see variants/README.md).
#
# The C line populates the writable backing store of the fstab mount
# declared in fstab.d/example.conf from its factory template (shipped
# through static/usr/share/factory/). The nested d line demonstrates the
# "entry inside an existing mount" case: it declares no fstab entry of
# its own and is accepted by the 993-factory-files test because its path
# is nested under the /etc/example mount.
C /writable/system-data/etc/example
d /writable/system-data/etc/example/subdir 0755 root root - -
