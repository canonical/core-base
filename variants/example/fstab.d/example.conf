# Example variant writable mount (see variants/README.md).
#
# This is the demonstration payload: it shows the fstab.d knob with the
# same shape a real variant would use (a /writable/system-data bind
# mount, x-initrd.mount for an /etc path). Its mount point ships through
# the static/ knob (static/etc/example/), its core-writable.conf C line
# and a nested d line ship through writable.conf.d/example.conf, and the
# C line's factory template ships through static/usr/share/factory/ --
# see the 993-factory-files build-time test, which gates the
# synchronization of all three.
/writable/system-data/etc/example /etc/example none bind,x-initrd.mount 0 0
