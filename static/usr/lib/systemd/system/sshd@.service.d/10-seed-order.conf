# Do not let sshd serve sessions before snapd has finished seeding.
#
# ssh.socket listens on port 22 from sockets.target onward, minutes
# before snapd.seeded.service completes. A login in that window races
# snapd's per-user session agent: the agent socket
# (/run/user/<uid>/snapd-session-agent.socket) only exists while a
# session is open, and snapd manages user-scope snap services through
# it. When a service-control request lands while the last short-lived
# session closes, the socket fails ("connection reset"/"connection
# refused"), the seed change errors, and on Ubuntu Core Desktop the
# retry change then parks in Wait at the gadget restart boundary -
# CoreDesktop snapd postpones the requested restart to a "manual" one
# that never comes mid-boot, so first boot never completes.
# (Observed on CI image builds polling SSH every 10s: see
# canonical/core-base#493 and Launchpad bug #2178247.)
#
# With this ordering no sshd session can start until snapd.seeded is
# done: "ssh connects" implies "the system is seeded". Images with
# baked credentials (CI gates, dev images, system-user assertions
# with SSH keys) keep SSH fully enabled; the connection just
# completes later. ssh.socket is deliberately NOT ordered the same
# way: ssh.socket is Before=sockets.target, and putting
# After=snapd.seeded on it too creates an ordering cycle
# (basic.target -> sockets.target -> ssh.socket -> snapd.seeded ->
# basic.target) that systemd resolves by dropping the snapd.seeded
# edge, leaving ssh.socket dead for the whole boot (observed 2026-11-
# 27). The socket may listen, but ssh.service cannot be started to
# serve it until seeding is done; the 30s connect backlog rides
# clients over the transition. getty is deliberately not ordered
# either, so serial-console root login stays available for boot
# diagnosis.
[Unit]
After=snapd.seeded.service
